name  : CI

on : 
    push : 
          branches : [main]


jobs : 
   test :
      runs-on : ubuntu-latest

      steps:
         - name : Checkout code
           uses : actions/checkout@v4

         - name : Set up Node.js
           uses : actions/setup-node@v4
           with : 
             node-version : '24'

         - name : Install dependencies
           run : npm ci

         - name : Install vuln-fixture's own dependencies
           working-directory: target-repos/vuln-fixture
           run: npm install

         - name : Run tests
           run : npm test